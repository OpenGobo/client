[package]
name = "client"
version = "0.1.0"
description = "OpenGobo Client"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/OpenGobo/client"

[lib]
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
opengobo-protocol = { git = "https://github.com/OpenGobo/core.git", branch = "main" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
